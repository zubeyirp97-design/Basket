
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bir Şut Daha!</title>
</head>

<body>
    <h1>Bir Şut Daha! 🏀</h1>
    <p>İlk basketbol oyunumuz!</p>

    <canvas id="oyunAlani" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("oyunAlani");
        const ctx = canvas.getContext("2d");

        // Gökyüzü
        ctx.fillStyle = "#b8e4d6";
        ctx.fillRect(0, 0, 800, 500);

        // Basketbol sahası
        ctx.fillStyle = "#e7bd77";
        ctx.fillRect(0, 350, 800, 150);

        // Saha çizgisi
        ctx.strokeStyle = "white";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 450);
        ctx.lineTo(800, 450);
        ctx.stroke();

        // Pota direği
        ctx.fillStyle = "#637b78";
        ctx.fillRect(650, 170, 12, 280);

        // Pota tahtası
        ctx.fillStyle = "white";
        ctx.fillRect(610, 140, 90, 60);

        // Çember
        ctx.strokeStyle = "#ef6b35";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(600, 210);
        ctx.lineTo(660, 210);
        ctx.stroke();

        // Oyuncunun gölgesi
        ctx.fillStyle = "#b18a55";
        ctx.beginPath();
        ctx.ellipse(150, 445, 32, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ayakkabılar
        ctx.fillStyle = "#263f3b";
        ctx.fillRect(128, 430, 22, 10);
        ctx.fillRect(153, 430, 22, 10);

        // Bacaklar
        ctx.strokeStyle = "#294c49";
        ctx.lineWidth = 12;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(140, 425);
        ctx.lineTo(140, 395);
        ctx.moveTo(162, 425);
        ctx.lineTo(162, 395);
        ctx.stroke();

        // Forma
        ctx.fillStyle = "#ef6b35";
        ctx.fillRect(130, 355, 42, 42);

        // Kollar
        ctx.strokeStyle = "#b97952";
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(132, 365);
        ctx.lineTo(117, 390);
        ctx.moveTo(170, 365);
        ctx.lineTo(185, 390);
        ctx.stroke();

        // Kafa
        ctx.fillStyle = "#b97952";
        ctx.beginPath();
        ctx.arc(151, 341, 17, 0, Math.PI * 2);
        ctx.fill();

        // Saç
        ctx.fillStyle = "#253b38";
        ctx.beginPath();
        ctx.arc(151, 337, 17, Math.PI, Math.PI * 2);
        ctx.fill();
        
        // Basketbol topu
        ctx.fillStyle = "#ef6b35";
        ctx.beginPath();
        ctx.arc(150, 325, 18, 0, Math.PI * 2);
        ctx.fill();
    </script>
</body>
</html>
